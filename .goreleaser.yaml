# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
project_name: http-proxy-lantern
metadata:
  maintainers:
    - "Lantern Team <dev@getlantern.org>"
  description: Lantern HTTP Proxy
  homepage: "https://github.com/getlantern/http-proxy-lantern"
  license: "GPL"

builds:
  - id: amd64
    main: ./http-proxy
    flags:
      - -v
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -buildid=
    binary: http-proxy

  - id: arm64
    main: ./http-proxy
    flags:
      - -v
      - -trimpath
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -buildid=
    binary: http-proxy

nightly:
  # Debian/RPM Version fields must start with a digit, so the bare short commit
  # (e.g. "dd44277c") is rejected by dpkg with "version number does not start
  # with digit" whenever the SHA happens to start with a-f. Prefix a digit-
  # leading stub; the short commit stays in the package file name (see
  # nfpms.file_name_template) so the cloud-init download URL is unchanged.
  version_template: "0.0.0+{{ .ShortCommit }}"
  # Immutable per-build releases: each merge to main publishes its own release
  # "nightly-<shortcommit>" whose assets are never overwritten, instead of a
  # single mutable "nightly" release that a rebuild would delete out from under
  # any VPS still pinned to the previous build. That deletion 404'd http-proxy
  # VPS provisioning fleet-wide (getlantern/engineering#3697). The lantern-cloud
  # provisioner composes the download URL as
  # .../releases/download/nightly-<short>/http-proxy-lantern_<short>_linux_<arch>.deb.
  tag_name: "nightly-{{ .ShortCommit }}"
  publish_release: true
  # Keep every build's release (was true). With a unique per-build tag_name
  # there is nothing for keep_single_release to prune anyway; false makes the
  # keep-all intent explicit.
  keep_single_release: false

archives:
  - formats: ["tar.gz"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  replace_existing_artifacts: true

nfpms:
  - id: http-proxy
    package_name: "http-proxy-lantern"
    # Keep the short commit in the package file name (decoupled from the
    # digit-prefixed Version above) so the asset stays
    # http-proxy-lantern_<shortcommit>_linux_<arch>.deb — the name the VPS
    # cloud-init builds its download URL from (bandit_vps_http_proxy_default_short_tag).
    file_name_template: "http-proxy-lantern_{{ .ShortCommit }}_linux_{{ .Arch }}"
    formats:
      - deb
      - rpm
    section: "default"
    maintainer: "Lantern Team <dev@getlantern.org>"
    description: |
      Lantern HTTP Proxy
    vendor: "Brave New Software"
    homepage: "https://github.com/getlantern/http-proxy-lantern"
    license: "GPL"
    contents:
      - src: internal/http-proxy.service
        dst: /usr/lib/systemd/system/http-proxy.service
      - src: internal/http-proxy@.service
        dst: /usr/lib/systemd/system/http-proxy@.service
